[package]
name = "aether"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "AETHER — Adaptive Entangled Thought with Holographic Emergent Resonance: a novel neural AI architecture in pure Rust"
license = "MIT"
repository = "https://github.com/efikoman76-ship-it/nnhhh"
keywords = ["ai", "neural-network", "hyperdimensional-computing", "mixture-of-experts", "creativity"]
categories = ["science", "machine-learning"]

[lib]
name = "aether"
path = "src/lib.rs"

[[bin]]
name = "aether"
path = "src/main.rs"

[dependencies]
rand = "0.8"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "aether_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
